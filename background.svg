<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  
  <defs>
    <!-- Premium Soft Shadows -->
    <filter id="premShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4A5568" flood-opacity="0.06"/>
    </filter>

    <!-- Soft Glow -->
    <filter id="premGlow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
    </filter>

    <!-- Premium Crystal Gradients -->
    <linearGradient id="crystal1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F8CF7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="crystal2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00B894" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#4F8CF7" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="crystal3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FD79A8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FDCB6E" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Typewriter Animation -->
    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        animation: blink 0.8s step-end infinite;
      }
    </style>
  </defs>

  <!-- Dark Background -->
  <rect width="800" height="450" fill="#0d1117"/>

  <!-- Glowing Orbs -->
  <circle cx="680" cy="100" r="200" fill="url(#crystal1)" filter="url(#premGlow)"/>
  <circle cx="120" cy="380" r="220" fill="url(#crystal2)" filter="url(#premGlow)"/>
  <circle cx="400" cy="250" r="180" fill="url(#crystal3)" filter="url(#premGlow)"/>

  <!-- ─── 3D CRYSTAL STRUCTURES ─── -->
  <g filter="url(#premShadow)">
    <polygon points="800,0 500,0 650,180 800,100" fill="url(#crystal2)"/>
    <polygon points="500,0 400,70 650,180" fill="url(#crystal3)"/>
    <polygon points="100,380 350,250 480,400 200,430" fill="url(#crystal1)"/>
    <polygon points="350,250 600,350 480,400" fill="url(#crystal3)"/>
    <polygon points="0,400 150,300 220,430 0,450" fill="url(#crystal2)"/>
    <polygon points="0,0 200,0 150,150 0,120" fill="url(#crystal1)"/>
  </g>

  <!-- ─── FLOATING PARTICLES ─── -->
  <g>
    <circle cx="100" cy="100" r="3" fill="#4F8CF7" opacity="0.3">
      <animate attributeName="cy" values="100;70;130;100" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="200" r="2" fill="#00B894" opacity="0.25">
      <animate attributeName="cy" values="200;170;230;200" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="80" r="3" fill="#FD79A8" opacity="0.2">
      <animate attributeName="cy" values="80;50;110;80" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="250" r="2.5" fill="#7C3AED" opacity="0.25">
      <animate attributeName="cy" values="250;220;280;250" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="400" r="2" fill="#FDCB6E" opacity="0.2">
      <animate attributeName="cy" values="400;370;430;400" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="380" r="2.5" fill="#4F8CF7" opacity="0.2">
      <animate attributeName="cy" values="380;350;410;380" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="400" r="2" fill="#00B894" opacity="0.2">
      <animate attributeName="cy" values="400;370;430;400" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="150" r="2" fill="#FD79A8" opacity="0.2">
      <animate attributeName="cy" values="150;120;180;150" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="280" r="2.5" fill="#7C3AED" opacity="0.2">
      <animate attributeName="cy" values="280;250;310;280" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ─── ROTATING CRYSTAL CUBES ─── -->
  <g transform="translate(180, 300)" filter="url(#premShadow)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="25s" repeatCount="indefinite"/>
      <polygon points="0,-28 24,-14 24,14 0,28" fill="url(#crystal1)" stroke="#4F8CF7" stroke-width="1" opacity="0.6"/>
      <polygon points="24,-14 48,0 48,28 24,14" fill="url(#crystal2)" stroke="#00B894" stroke-width="1" opacity="0.4"/>
      <polygon points="0,-28 24,-14 48,0 24,-14" fill="url(#crystal3)" stroke="#FD79A8" stroke-width="1" opacity="0.3"/>
    </g>
  </g>

  <g transform="translate(620, 320)" filter="url(#premShadow)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="360;0" dur="30s" repeatCount="indefinite"/>
      <polygon points="0,-22 19,-11 19,11 0,22" fill="url(#crystal2)" stroke="#00B894" stroke-width="1" opacity="0.5"/>
      <polygon points="19,-11 38,0 38,22 19,11" fill="url(#crystal3)" stroke="#FD79A8" stroke-width="1" opacity="0.3"/>
      <polygon points="0,-22 19,-11 38,0 19,-11" fill="url(#crystal1)" stroke="#4F8CF7" stroke-width="1" opacity="0.3"/>
    </g>
  </g>

  <!-- ─── SPINNING GEOMETRIC SHAPES ─── -->
  <g transform="translate(400, 180)" filter="url(#premGlow)">
    <polygon points="0,-18 16,9 -16,9" fill="none" stroke="#4F8CF7" stroke-width="1.5" opacity="0.25">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="15s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <g transform="translate(300, 400)" filter="url(#premGlow)">
    <polygon points="0,-14 12,7 -12,7" fill="none" stroke="#00B894" stroke-width="1.5" opacity="0.2">
      <animateTransform attributeName="transform" type="rotate" values="360;0" dur="12s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- ─── PULSING RINGS ─── -->
  <circle cx="350" cy="200" r="45" fill="none" stroke="#4F8CF7" stroke-width="1" opacity="0.08">
    <animate attributeName="r" values="45;85;45" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.08;0;0.08" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="350" r="35" fill="none" stroke="#00B894" stroke-width="1" opacity="0.08">
    <animate attributeName="r" values="35;75;35" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.08;0;0.08" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- ─── SUBTLE BORDER ─── -->
  <rect x="2" y="2" width="796" height="446" rx="16" fill="none" stroke="#4F8CF7" stroke-width="1" opacity="0.06">
    <animate attributeName="opacity" values="0.06;0.15;0.06" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- CONTENT WITH ANIMATED TEXT                                -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

    <!-- ─── MAIN HEADER WITH TYPING EFFECT ─── -->
    <text x="400" y="65" font-size="34" font-weight="800" fill="#e6edf3" text-anchor="middle" letter-spacing="1">
      SANAULLAH
    </text>

    <!-- Animated Typing Subtitle -->
    <text x="400" y="95" font-size="14" fill="#00F0FF" text-anchor="middle" font-weight="600">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="8s" repeatCount="indefinite"/>
      AI/ML Researcher
    </text>
    <text x="400" y="115" font-size="14" fill="#00F0FF" text-anchor="middle" font-weight="600">
      <animate attributeName="opacity" values="0;0;1;1;0" dur="8s" repeatCount="indefinite"/>
      NLP &amp; Computer Vision
    </text>
    <text x="400" y="115" font-size="14" fill="#00F0FF" text-anchor="middle" font-weight="600">
      <animate attributeName="opacity" values="0;0;0;0;1" dur="8s" repeatCount="indefinite"/>
      Decentralized AI Systems
    </text>

    <!-- Blinking Cursor -->
    <text x="400" y="135" font-size="16" fill="#00F0FF" text-anchor="middle" font-weight="600">
      <animate attributeName="opacity" values="1;0;1;0" dur="1s" repeatCount="indefinite"/>
      █
    </text>

    <!-- Subtitle -->
    <text x="400" y="160" font-size="11" fill="#8b949e" text-anchor="middle" font-style="italic">
      Architecting Decentralized Intelligence, LLM Pipelines &amp; Computer Vision Models
    </text>

    <!-- ─── SOCIAL LINKS ─── -->
    <text x="400" y="190" font-size="10" fill="#58a6ff" text-anchor="middle" font-weight="600">
      <tspan fill="#58a6ff">LINKEDIN</tspan>
      <tspan fill="#8b949e">  ◆  </tspan>
      <tspan fill="#58a6ff">PORTFOLIO</tspan>
      <tspan fill="#8b949e">  ◆  </tspan>
      <tspan fill="#58a6ff">HUGGING FACE</tspan>
      <tspan fill="#8b949e">  ◆  </tspan>
      <tspan fill="#58a6ff">KAGGLE</tspan>
      <tspan fill="#8b949e">  ◆  </tspan>
      <tspan fill="#58a6ff">EMAIL</tspan>
    </text>

    <!-- Location & Degree -->
    <text x="400" y="210" font-size="10" fill="#8b949e" text-anchor="middle">
      <tspan fill="#58a6ff">●</tspan> Location: Islamabad
      <tspan fill="#8b949e">  |  </tspan>
      <tspan fill="#58a6ff">●</tspan> Degree: BSCS @ Abasyn University
    </text>

    <!-- Divider -->
    <text x="400" y="235" font-size="18" fill="#21262d" text-anchor="middle">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</text>

    <!-- ─── TECHNICAL ECOSYSTEM ─── -->
    <text x="400" y="265" font-size="16" font-weight="700" fill="#58a6ff" text-anchor="middle">⚡ TECHNICAL ECOSYSTEM</text>

    <!-- Row 1: AI/ML + Languages -->
    <text x="220" y="295" font-size="13" font-weight="600" fill="#58a6ff" text-anchor="middle">◆ AI / MACHINE LEARNING</text>
    <text x="580" y="295" font-size="13" font-weight="600" fill="#58a6ff" text-anchor="middle">◈ LANGUAGES &amp; DATA</text>

    <text x="220" y="315" font-size="11" fill="#e6edf3" text-anchor="middle">PyTorch • TensorFlow • Scikit-learn</text>
    <text x="580" y="315" font-size="11" fill="#e6edf3" text-anchor="middle">Python • NumPy • Pandas • Matplotlib</text>

    <text x="220" y="335" font-size="10" fill="#8b949e" text-anchor="middle">NLP • Computer Vision • LLMs</text>

    <!-- Row 2: Web + MLOps -->
    <text x="220" y="365" font-size="13" font-weight="600" fill="#58a6ff" text-anchor="middle">◇ WEB &amp; SYSTEMS</text>
    <text x="580" y="365" font-size="13" font-weight="600" fill="#58a6ff" text-anchor="middle">◉ MLOPS &amp; INFRASTRUCTURE</text>

    <text x="220" y="385" font-size="11" fill="#e6edf3" text-anchor="middle">Next.js • React • Node.js • MongoDB</text>
    <text x="580" y="385" font-size="11" fill="#e6edf3" text-anchor="middle">Docker • Git • GitHub • Colab • Kaggle • VS Code</text>

    <!-- Divider -->
    <text x="400" y="410" font-size="18" fill="#21262d" text-anchor="middle">━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</text>

    <!-- ─── FOOTER ─── -->
    <text x="400" y="435" font-size="11" fill="#8b949e" text-anchor="middle">
      <tspan fill="#58a6ff" font-weight="bold">@SANAULLAH-AI</tspan>
      <tspan fill="#8b949e">  •  AI/ML Researcher  •  Islamabad, Pakistan</tspan>
    </text>

  </g>

</svg>
