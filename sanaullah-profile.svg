<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1450" width="900" height="1450">
  <defs>
    <!-- Background -->
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#080e18"/>
    </linearGradient>

    <!-- Card background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0c1322"/>
    </linearGradient>

    <!-- Cyan gradient for name -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Soft glows -->
    <radialGradient id="topGlow" cx="50%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sideGlow" cx="85%" cy="40%" r="30%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#00f0ff" stroke-width="0.3" opacity="0.05"/>
    </pattern>

    <!-- Animated dash for borders -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- ===================== PAGE BACKGROUND ===================== -->
  <rect width="900" height="1450" rx="20" fill="url(#pageBg)"/>
  <rect width="900" height="1450" rx="20" fill="url(#grid)"/>
  <rect width="900" height="1450" rx="20" fill="url(#topGlow)"/>
  <rect width="900" height="1450" rx="20" fill="url(#sideGlow)"/>

  <!-- Floating particles (background only) -->
  <g opacity="0.5">
    <circle cx="80" cy="120" r="2" fill="#00f0ff">
      <animate attributeName="cy" values="120;90;120" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="180" r="1.8" fill="#7c3aed">
      <animate attributeName="cy" values="180;150;180" dur="9s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="700" r="1.6" fill="#00f0ff">
      <animate attributeName="cy" values="700;670;700" dur="7s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="900" r="2" fill="#00f0ff">
      <animate attributeName="cy" values="900;870;900" dur="8.5s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="1200" r="1.7" fill="#7c3aed">
      <animate attributeName="cy" values="1200;1170;1200" dur="9s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="1300" r="1.5" fill="#00f0ff">
      <animate attributeName="cy" values="1300;1270;1300" dur="7.5s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===================== HEADER ===================== -->
  <g>
    <!-- Header card -->
    <rect x="40" y="40" width="820" height="320" rx="18" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Top accent line -->
    <rect x="40" y="40" width="820" height="3" rx="1.5" fill="#00f0ff" opacity="0.7">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- Neural network decoration (left) -->
    <g opacity="0.35" filter="url(#softGlow)">
      <path d="M70,100 Q120,80 160,120" fill="none" stroke="#00f0ff" stroke-width="1">
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="5s" repeatCount="indefinite"/>
      </path>
      <path d="M70,180 Q110,150 160,190" fill="none" stroke="#00f0ff" stroke-width="0.9">
        <animate attributeName="opacity" values="0.15;0.4;0.15" dur="5.5s" begin="0.8s" repeatCount="indefinite"/>
      </path>
      <circle cx="70" cy="100" r="3.5" fill="#00f0ff">
        <animate attributeName="r" values="3;4.5;3" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="160" cy="120" r="3" fill="#00f0ff">
        <animate attributeName="r" values="2.5;4;2.5" dur="3.5s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="70" cy="180" r="3" fill="#7c3aed">
        <animate attributeName="r" values="2.5;4;2.5" dur="3.2s" begin="1s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Neural network decoration (right) -->
    <g opacity="0.35" filter="url(#softGlow)">
      <path d="M740,110 Q790,85 830,125" fill="none" stroke="#00f0ff" stroke-width="1">
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="5s" begin="0.6s" repeatCount="indefinite"/>
      </path>
      <path d="M740,200 Q780,170 830,210" fill="none" stroke="#7c3aed" stroke-width="0.9">
        <animate attributeName="opacity" values="0.15;0.4;0.15" dur="5.5s" begin="1.2s" repeatCount="indefinite"/>
      </path>
      <circle cx="740" cy="110" r="3" fill="#00f0ff">
        <animate attributeName="r" values="2.5;4;2.5" dur="3.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="830" cy="125" r="3.5" fill="#00f0ff">
        <animate attributeName="r" values="3;4.5;3" dur="3.6s" begin="0.7s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- NAME -->
    <text x="450" y="145" text-anchor="middle" 
          font-family="'Segoe UI', system-ui, -apple-system, sans-serif" 
          font-size="48" font-weight="800" fill="url(#nameGrad)" 
          letter-spacing="3" filter="url(#glow)">
      SANAULLAH
    </text>

    <!-- Underline -->
    <line x1="280" y1="160" x2="620" y2="160" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3.5s" repeatCount="indefinite"/>
    </line>

    <!-- Role -->
    <text x="450" y="200" text-anchor="middle" 
          font-family="'Segoe UI', system-ui, sans-serif" 
          font-size="20" font-weight="600" fill="#e2e8f0">
      AI / ML Researcher
    </text>

    <!-- Subtitle -->
    <text x="450" y="235" text-anchor="middle" 
          font-family="'Segoe UI', system-ui, sans-serif" 
          font-size="13.5" fill="#94a3b8" font-style="italic">
      Architecting Decentralized Intelligence, LLM Pipelines &amp; Computer Vision
    </text>

    <!-- Info badges -->
    <g font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="500">
      <!-- Location -->
      <rect x="200" y="270" width="155" height="30" rx="15" fill="#0f2744" stroke="#1e4976" stroke-width="1"/>
      <text x="277" y="290" text-anchor="middle" fill="#67e8f9">📍 Islamabad</text>

      <!-- Degree -->
      <rect x="370" y="270" width="250" height="30" rx="15" fill="#0f2744" stroke="#1e4976" stroke-width="1"/>
      <text x="495" y="290" text-anchor="middle" fill="#94a3b8">BSCS @ Abasyn University</text>

      <!-- Handle -->
      <rect x="635" y="270" width="130" height="30" rx="15" fill="#0f2744" stroke="#1e4976" stroke-width="1"/>
      <text x="700" y="290" text-anchor="middle" fill="#58a6ff">@SANAULLAH-AI</text>
    </g>
  </g>

  <!-- ===================== BODY - TECHNICAL ECOSYSTEM ===================== -->
  
  <!-- Section Title -->
  <text x="450" y="410" text-anchor="middle" 
        font-family="'Segoe UI', system-ui, sans-serif" 
        font-size="18" font-weight="700" fill="#00f0ff" letter-spacing="1.5">
    ⚡ TECHNICAL ECOSYSTEM
  </text>

  <!-- ===== CARD 1: AI / MACHINE LEARNING ===== -->
  <g>
    <rect x="40" y="440" width="820" height="145" rx="14" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.2">
      <animate attributeName="stroke" values="#1e293b;#0e7490;#1e293b" dur="6s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Card header bar -->
    <rect x="40" y="440" width="6" height="145" rx="3" fill="#00f0ff" opacity="0.8"/>
    
    <text x="70" y="475" 
          font-family="'Segoe UI', system-ui, sans-serif" 
          font-size="15" font-weight="700" fill="#67e8f9">
      ◆  AI / MACHINE LEARNING
    </text>

    <!-- Tech pills -->
    <g font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">
      <rect x="70" y="500" width="110" height="32" rx="8" fill="#1a0a0a" stroke="#ee4c2c" stroke-width="1.2"/>
      <text x="125" y="521" text-anchor="middle" fill="#ee4c2c">PyTorch</text>

      <rect x="195" y="500" width="130" height="32" rx="8" fill="#1a1000" stroke="#ff6f00" stroke-width="1.2"/>
      <text x="260" y="521" text-anchor="middle" fill="#ff6f00">TensorFlow</text>

      <rect x="340" y="500" width="130" height="32" rx="8" fill="#1a1200" stroke="#f7931e" stroke-width="1.2"/>
      <text x="405" y="521" text-anchor="middle" fill="#f7931e">Scikit-learn</text>
    </g>

    <text x="70" y="560" 
          font-family="'Segoe UI', system-ui, sans-serif" 
          font-size="13" fill="#64748b">
      NLP  ·  Computer Vision  ·  LLMs  ·  Deep Learning
    </text>
  </g>

  <!-- ===== CARD 2: LANGUAGES & DATA ===== -->
  <g>
    <rect x="40" y="605" width="820" height="145" rx="14" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.2">
      <animate attributeName="stroke" values="#1e293b;#1e40af;#1e293b" dur="7s" begin="1s" repeatCount="indefinite"/>
    </rect>
    
    <rect x="40" y="605" width="6" height="145" rx="3" fill="#3b82f6" opacity="0.8"/>
    
    <text x="70" y="640" 
          font-family="'Segoe UI', system-ui, sans-serif" 
          font-size="15" font-weight="700" fill="#60a5fa">
      ◈  LANGUAGES &amp; DATA
    </text>

    <g font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">
      <rect x="70" y="665" width="100" height="32" rx="8" fill="#0a1525" stroke="#3776ab" stroke-width="1.2"/>
      <text x="120" y="686" text-anchor="middle" fill="#3776ab">Python</text>

      <rect x="185" y="665" width="95" height="32" rx="8" fill="#051015" stroke="#013243" stroke-width="1.2"/>
      <text x="232" y="686" text-anchor="middle" fill="#4db6ac">NumPy</text>

      <rect x="295" y="665" width="100" height="32" rx="8" fill="#0a0a1a" stroke="#150458" stroke-width="1.2"/>
      <text x="345" y="686" text-anchor="middle" fill="#818cf8">Pandas</text>

      <rect x="410" y="665" width="120" height="32" rx="8" fill="#051520" stroke="#11557c" stroke-width="1.2"/>
      <text x="470" y="686" text-anchor="middle" fill="#38bdf8">Matplotlib</text>
    </g>

    <text x="70" y="725" 
          font-family="'Segoe UI', system-ui, sans-serif" 
          font-size="13" fill="#64748b">
      Data Analysis  ·  Visualization  ·  Scientific Computing
    </text>
  </g>

  <!-- ===== CARD 3: WEB & SYSTEMS ===== -->
  <g>
    <rect x="40" y="770" width="820" height="145" rx="14" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.2">
      <animate attributeName="stroke" values="#1e293b;#166534;#1e293b" dur="6.5s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    
    <rect x="40" y="770" width="6" height="145" rx="3" fill="#22c55e" opacity="0.8"/>
    
    <text x="70" y="805" 
          font-family="'Segoe UI', system-ui, sans-serif" 
          font-size="15" font-weight="700" fill="#4ade80">
      ◇  WEB &amp; SYSTEMS
    </text>

    <g font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">
      <rect x="70" y="830" width="100" height="32" rx="8" fill="#0a0a0a" stroke="#ffffff" stroke-width="1.2"/>
      <text x="120" y="851" text-anchor="middle" fill="#e2e8f0">Next.js</text>

      <rect x="185" y="830" width="95" height="32" rx="8" fill="#0a1520" stroke="#61dafb" stroke-width="1.2"/>
      <text x="232" y="851" text-anchor="middle" fill="#61dafb">React</text>

      <rect x="295" y="830" width="100" height="32" rx="8" fill="#0a150a" stroke="#339933" stroke-width="1.2"/>
      <text x="345" y="851" text-anchor="middle" fill="#4ade80">Node.js</text>

      <rect x="410" y="830" width="110" height="32" rx="8" fill="#0a150a" stroke="#47a248" stroke-width="1.2"/>
      <text x="465" y="851" text-anchor="middle" fill="#4ade80">MongoDB</text>
    </g>

    <text x="70" y="890" 
          font-family="'Segoe UI', system-ui, sans-serif" 
          font-size="13" fill="#64748b">
      Full-Stack Development  ·  APIs  ·  Databases
    </text>
  </g>

  <!-- ===== CARD 4: MLOPS & INFRASTRUCTURE ===== -->
  <g>
    <rect x="40" y="935" width="820" height="160" rx="14" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.2">
      <animate attributeName="stroke" values="#1e293b;#b45309;#1e293b" dur="7s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    
    <rect x="40" y="935" width="6" height="160" rx="3" fill="#f59e0b" opacity="0.8"/>
    
    <text x="70" y="970" 
          font-family="'Segoe UI', system-ui, sans-serif" 
          font-size="15" font-weight="700" fill="#fbbf24">
      ◉  MLOPS &amp; INFRASTRUCTURE
    </text>

    <g font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600">
      <rect x="70" y="995" width="95" height="30" rx="8" fill="#0a1520" stroke="#2496ed" stroke-width="1.2"/>
      <text x="117" y="1015" text-anchor="middle" fill="#38bdf8">Docker</text>

      <rect x="180" y="995" width="75" height="30" rx="8" fill="#1a0a0a" stroke="#f05032" stroke-width="1.2"/>
      <text x="217" y="1015" text-anchor="middle" fill="#f87171">Git</text>

      <rect x="270" y="995" width="95" height="30" rx="8" fill="#0a0a0a" stroke="#e2e8f0" stroke-width="1.2"/>
      <text x="317" y="1015" text-anchor="middle" fill="#e2e8f0">GitHub</text>

      <rect x="380" y="995" width="90" height="30" rx="8" fill="#1a1500" stroke="#f9ab00" stroke-width="1.2"/>
      <text x="425" y="1015" text-anchor="middle" fill="#fbbf24">Colab</text>

      <rect x="485" y="995" width="95" height="30" rx="8" fill="#0a1520" stroke="#20beff" stroke-width="1.2"/>
      <text x="532" y="1015" text-anchor="middle" fill="#38bdf8">Kaggle</text>

      <rect x="595" y="995" width="100" height="30" rx="8" fill="#0a1525" stroke="#007acc" stroke-width="1.2"/>
      <text x="645" y="1015" text-anchor="middle" fill="#38bdf8">VS Code</text>
    </g>

    <text x="70" y="1060" 
          font-family="'Segoe UI', system-ui, sans-serif" 
          font-size="13" fill="#64748b">
      Containerization  ·  Version Control  ·  Experiment Tracking
    </text>
  </g>

  <!-- ===================== ACTIVE REPOSITORIES ===================== -->
  <text x="450" y="1145" text-anchor="middle" 
        font-family="'Segoe UI', system-ui, sans-serif" 
        font-size="16" font-weight="700" fill="#00f0ff" letter-spacing="1">
    ◆  ACTIVE REPOSITORIES
  </text>

  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600">
    <rect x="60" y="1170" width="145" height="34" rx="8" fill="#0c1525" stroke="#1e3a5f" stroke-width="1.2"/>
    <text x="132" y="1192" text-anchor="middle" fill="#94a3b8">Lightningclean</text>

    <rect x="220" y="1170" width="155" height="34" rx="8" fill="#0c1525" stroke="#1e3a5f" stroke-width="1.2"/>
    <text x="297" y="1192" text-anchor="middle" fill="#94a3b8">Expense-Tracker</text>

    <rect x="390" y="1170" width="140" height="34" rx="8" fill="#0c1525" stroke="#1e3a5f" stroke-width="1.2"/>
    <text x="460" y="1192" text-anchor="middle" fill="#94a3b8">MobileAppDev</text>

    <rect x="545" y="1170" width="150" height="34" rx="8" fill="#0c1525" stroke="#1e3a5f" stroke-width="1.2"/>
    <text x="620" y="1192" text-anchor="middle" fill="#94a3b8">DevCheatSheets</text>

    <rect x="710" y="1170" width="140" height="34" rx="8" fill="#0c1525" stroke="#1e3a5f" stroke-width="1.2"/>
    <text x="780" y="1192" text-anchor="middle" fill="#94a3b8">My-Workstation</text>
  </g>

  <!-- ===================== FOOTER ===================== -->
  <g>
    <!-- Divider line -->
    <line x1="100" y1="1250" x2="800" y2="1250" stroke="#00f0ff" stroke-width="0.8" opacity="0.25">
      <animate attributeName="opacity" values="0.15;0.4;0.15" dur="5s" repeatCount="indefinite"/>
    </line>

    <text x="450" y="1295" text-anchor="middle" 
          font-family="'Segoe UI', system-ui, sans-serif" 
          font-size="14" fill="#64748b">
      <tspan fill="#58a6ff" font-weight="700">@SANAULLAH-AI</tspan>
      <tspan>  •  AI/ML Researcher  •  Islamabad, Pakistan</tspan>
    </text>

    <text x="450" y="1330" text-anchor="middle" 
          font-family="'Segoe UI', system-ui, sans-serif" 
          font-size="12" fill="#475569">
      Building Decentralized Intelligence Systems
    </text>

    <!-- Bottom accent -->
    <rect x="300" y="1360" width="300" height="3" rx="1.5" fill="#00f0ff" opacity="0.4">
      <animate attributeName="opacity" values="0.25;0.6;0.25" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Soft outer vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.25"/>
  </radialGradient>
  <rect width="900" height="1450" rx="20" fill="url(#vignette)"/>
</svg>
